services:
  shard-0:
    image: postgres:16
    container_name: shard-0
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - shard0_data:/var/lib/postgresql/data

  shard-1:
    image: postgres:16
    container_name: shard-1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5434:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data

  shard-2:
    image: postgres:16
    container_name: shard-2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db
    ports:
      - "5435:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data

volumes:
  shard0_data:
  shard1_data:
  shard2_data: